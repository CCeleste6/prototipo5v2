<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Legado Escolar | Modo Deluxe</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="wrapper">

    <header class="header">
      <img id="rank-badge" class="rank-badge" />
      <h1 class="title">Legado Escolar</h1>
      <h2 id="rank-display" class="rank-name"></h2>
    </header>

    <main>
      <section class="card">
        <h3 class="card-title">Quiz da Atividade</h3>
        <div id="quiz"></div>
      </section>

      <section class="card">
        <h3 class="card-title">Vantagens Disponíveis</h3>
        <p class="card-subtitle">Escolha as vantagens que deseja ativar:</p>
        <div id="vantagens-list"></div>
      </section>

      <button id="finish-btn" class="btn-primary">Finalizar Atividade</button>
    </main>

    <footer class="footer">
      Protótipo Oficial — Legado Escolar (Modo Deluxe)
    </footer>

  </div>

  <script src="VANTAGENS.js"></script>
  <script src="app.js"></script>

  <button id="master-btn" class="master-toggle">⚙ Mestre</button>

<div id="master-panel" class="master-panel hidden">
  <h3>Painel do Mestre</h3>
  <p>Controle e ferramentas avançadas</p>

  <button id="export-btn" class="btn-secondary">Exportar Dados (CSV)</button>
  <button id="reset-btn" class="btn-danger">Resetar Tudo</button>

  <div id="master-output"></div>

  <button id="close-master" class="btn-secondary">Fechar</button>
</div>

</body>
</html>
