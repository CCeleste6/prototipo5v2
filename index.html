<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGADO ESCOLAR · Quiz PM / PC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <h1 class="header__title">LEGADO ESCOLAR</h1>
    <p class="header__subtitle">Quiz PM · PC</p>
    <button id="save-progress" class="btn btn--small">Salvar</button>
  </header>

  <main class="quiz-container">
    <section class="scores">
      <div class="score">Precursores: <span id="score-precursores">0</span></div>
      <div class="score">Visionários: <span id="score-visionarios">0</span></div>
      <div class="score">Guardiões: <span id="score-guardioes">0</span></div>
      <div class="score">Solidários: <span id="score-solidarios">0</span></div>
    </section>

    <section class="quiz">
      <div id="question-container" class="question-container">
        <!-- Aqui vai a pergunta carregada via JS -->
        <p id="question-text" class="question-text">Carregando pergunta...</p>
      </div>
      <div class="navigation">
        <button id="prev-btn" class="btn btn--nav">Anterior</button>
        <button id="next-btn" class="btn btn--nav">Próxima</button>
        <button id="submit-btn" class="btn btn--primary">Enviar Resposta</button>
      </div>
    </section>

    <section class="results" id="results" style="display: none;">
      <h2>Resultados</h2>
      <div class="final-scores">
        <div>Precursores: <span id="final-precursores">0</span></div>
        <div>Visionários: <span id="final-visionarios">0</span></div>
        <div>Guardiões: <span id="final-guardioes">0</span></div>
        <div>Solidários: <span id="final-solidarios">0</span></div>
      </div>
      <button id="restart-btn" class="btn btn--secondary">Reiniciar</button>
    </section>
  </main>

  <footer class="footer">
    <p>Nenhum progresso salvo</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
