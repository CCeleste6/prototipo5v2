<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legado Escolar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1 class="title">LEGADO ESCOLAR</h1>

  <!-- Painel do Mestre -->
  <section id="painel-mestre" class="card">
    <h2>🎓 Painel do Mestre</h2>
    <input id="nomeAluno" placeholder="Nome do aluno">
    <select id="casaAluno">
      <option>Precursores</option>
      <option>Visionários</option>
      <option>Guardiões</option>
      <option>Solidários</option>
    </select>
    <button onclick="criarAluno()">Criar aluno</button>

    <button onclick="exportarCSV()">Exportar CSV</button>
    <button onclick="resetSistema()" class="danger">Resetar Sistema</button>
  </section>

  <!-- Painel do Aluno -->
  <section id="painel-aluno" class="card">
    <h2>👤 Painel do Aluno</h2>
    <select id="selectAluno" onchange="renderAluno()"></select>

    <div id="dadosAluno"></div>

    <button onclick="ganharPM()">+ Atividade (PM)</button>
    <button onclick="ganharXP()">+ XP</button>

    <h3>Vantagens Disponíveis</h3>
    <div id="vantagens"></div>

    <h3>Inventário</h3>
    <div id="inventario"></div>
  </section>

  <!-- Ranking -->
  <button id="ranking-btn" class="ranking-toggle">📊 Ranking</button>
  <div id="ranking-panel" class="ranking-panel hidden">
    <h3>Ranking de Alunos</h3>
    <ul id="ranking-alunos"></ul>

    <h3>Ranking de Casas</h3>
    <ul id="ranking-casas"></ul>

    <button id="close-ranking">Fechar</button>
  </div>

  <script src="VANTAGENS.js"></script>
  <script src="app.js"></script>
</body>
</html>
