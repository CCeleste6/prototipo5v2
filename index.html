<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Legado Escolar | Protótipo</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>LEGADO ESCOLAR</h1>
    <h2 id="rank-display"></h2>
    <img id="rank-badge" class="rank-badge">
  </header>

  <section class="painel">
    <h3>Quiz da Atividade</h3>
    <div id="quiz"></div>
  </section>

  <section class="painel">
    <h3>Vantagens Disponíveis</h3>
    <p>Selecione as vantagens que deseja aplicar nesta atividade:</p>
    <div id="vantagens-list"></div>
  </section>

  <button id="finish-btn" class="btn-finalizar">Finalizar Atividade</button>

  <footer>
    <p>Protótipo Oficial - Legado Escolar</p>
  </footer>

  <script src="VANTAGENS.js"></script>
  <script src="app.js"></script>
</body>
</html>
